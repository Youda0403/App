name: Build APK

on:
  push:
    branches:
      - main
      - 'claude/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    # Gradle 데몬은 처음 떠 있을 때의 환경을 그대로 들고 간다.
    # 서명 키를 특정 스텝에만 주면 데몬이 그것을 못 보고 debug 키로 서명해 버리므로
    # 잡 전체에 건다. (GITHUB_RUN_NUMBER 는 러너가 기본으로 넣어 준다.)
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - name: 소스 가져오기
        uses: actions/checkout@v4

      - name: JDK 17 준비
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 준비 (캐시 포함)
        uses: gradle/actions/setup-gradle@v4

      - name: Android SDK 구성 요소 설치
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: 단위 테스트
        run: |
          set -o pipefail
          # --stacktrace 는 빼 둔다. 컴파일 오류가 수백 줄 스택 트레이스에 묻혀
          # 로그 끝만 봐서는 무엇이 틀렸는지 알 수 없게 된다.
          if ! ./gradlew testDebugUnitTest 2>&1 | tee gradle-output.txt; then
            echo "=============================================="
            echo " 컴파일 오류"
            echo "=============================================="
            grep -E "^e: " gradle-output.txt | head -40 || echo "(컴파일 오류 없음 - 테스트 실패로 보임)"
            echo "=============================================="
            echo " 실패한 테스트"
            echo "=============================================="
            grep -E "FAILED|AssertionError" gradle-output.txt | head -30 || true
            exit 1
          fi

      - name: Lint (오류만 확인)
        run: ./gradlew lintDebug --stacktrace
        continue-on-error: true

      - name: 릴리스 APK 빌드
        run: ./gradlew assembleRelease --stacktrace

      - name: 서명 검증
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          if [ -z "$APK" ]; then
            echo "::error::릴리스 APK 를 찾지 못했습니다."
            exit 1
          fi
          echo "APK=$APK" >> "$GITHUB_ENV"
          ls -lh "$APK"

          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          CERTS=$("$APKSIGNER" verify --print-certs "$APK")
          echo "$CERTS"

          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            # 시크릿을 넣었는데 debug 인증서로 서명되었다면 데몬이 키를 못 본 것이다.
            # 이대로 배포하면 나중에 키를 제대로 쓸 때 앱을 지웠다 깔아야 하므로 실패시킨다.
            if echo "$CERTS" | grep -q "CN=Android Debug"; then
              echo "::error::서명 키가 설정되어 있는데 debug 키로 서명되었습니다. 빌드를 중단합니다."
              exit 1
            fi
            if ! echo "$CERTS" | grep -q "CN=PAIRPLAY"; then
              echo "::error::예상한 서명 인증서가 아닙니다. 시크릿 값을 확인하세요."
              exit 1
            fi
            echo "릴리스 키로 정상 서명되었습니다."
          else
            echo "::warning::서명 시크릿이 없어 debug 키로 서명되었습니다. 이 APK 는 임시 확인용입니다. KEYSTORE_BASE64 등 4개 시크릿을 등록한 뒤 다시 빌드하세요."
          fi

      - name: 테스트 리포트 보관
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ github.run_number }}
          path: app/build/reports/
          retention-days: 7
          if-no-files-found: ignore

      - name: APK 보관 (워크플로 아티팩트)
        uses: actions/upload-artifact@v4
        with:
          name: pairplay-apk-${{ github.run_number }}
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Releases 에 게시 (휴대폰에서 바로 내려받기)
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_SHA: ${{ github.sha }}
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          TAG="build-${{ github.run_number }}"
          cp "$APK" "pairplay-${TAG}.apk"
          {
            echo "커밋: ${COMMIT_SHA}"
            echo "브랜치: ${BRANCH_NAME}"
            echo ""
            if [ -n "${KEYSTORE_BASE64:-}" ]; then
              echo "릴리스 키로 서명됨. 기존 앱 위에 덮어 설치할 수 있습니다."
            else
              echo "임시(debug) 키로 서명됨. 시크릿 등록 후 빌드한 APK 와는 서로 덮어쓸 수 없습니다."
            fi
            echo ""
            echo "휴대폰에서 아래 apk 파일을 눌러 설치하세요."
            echo "처음 설치할 때는 '출처를 알 수 없는 앱 설치 허용'이 필요하고,"
            echo "Play 프로텍트 경고가 뜰 수 있습니다."
          } > release-notes.md
          gh release create "$TAG" "pairplay-${TAG}.apk" \
            --title "PAIRPLAY $TAG" \
            --notes-file release-notes.md \
            --target "${COMMIT_SHA}"
